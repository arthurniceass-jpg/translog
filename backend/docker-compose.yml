# Sobe o Postgres e a API em modo produção-like:  docker compose up --build
# (para desenvolver sem Docker basta ./mvnw spring-boot:run — usa H2 em memória com dados de demonstração)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: translog
      POSTGRES_USER: translog
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    ports:
      - "5432:5432"
    volumes:
      - translog-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translog -d translog"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/translog
      DB_USER: translog
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env (32+ caracteres)}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  translog-pgdata:
