# DATABASE_URL (JDBC completo) ou, na falta dele, as partes DB_HOST/DB_PORT/DB_NAME (ex.: Render).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
# Obrigatório em produção: sem JWT_SECRET a aplicação não sobe.
translog.jwt.secret=${JWT_SECRET}
