spring.application.name=translog-api
# Perfil padrão para rodar local: dev (H2 em memória + dados de demonstração)
spring.profiles.default=dev

server.port=${PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jackson.default-property-inclusion=non_null

# JWT (HS256). Em produção defina JWT_SECRET com no mínimo 32 caracteres.
translog.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdef}
translog.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}

# CORS: origens separadas por vírgula
translog.cors.origens=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html
